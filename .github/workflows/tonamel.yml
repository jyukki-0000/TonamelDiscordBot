以下のデバッグスクリプトをローカルで実行して結果を貼っていただけますか？

python
# debug_tonamel.py
import asyncio
import re
from playwright.async_api import async_playwright

URL = "https://tonamel.com/competitions?game=shadowverse_worlds_beyond&region=JP"

async def main():
    async with async_playwright() as p:
        browser = await p.chromium.launch(headless=True, args=["--no-sandbox"])
        page = await browser.new_page()

        # networkidle で待機
        print("networkidle で待機中...")
        await page.goto(URL, wait_until="networkidle", timeout=90000)
        html = await page.content()
        ids = set(re.findall(r'/competition/([A-Za-z0-9]+)', html)) - {"index"}
        print(f"networkidle: {len(html)}文字 / 大会ID: {len(ids)}件")

        # さらに3秒待つ
        await page.wait_for_timeout(3000)
        html = await page.content()
        ids = set(re.findall(r'/competition/([A-Za-z0-9]+)', html)) - {"index"}
        print(f"networkidle+3秒: {len(html)}文字 / 大会ID: {len(ids)}件")

        # HTMLを保存
        with open("tonamel_debug.html", "w", encoding="utf-8") as f:
            f.write(html)
        print("tonamel_debug.html に保存しました")

        await browser.close()

asyncio.run(main())
