問題の分析
ログを見ると日付取得自体は成功しています。
実行日は 2026/05/30 で、ft50T の大会（2026/05/30 12:00）は正しく取得できています。

本当の問題は「当日大会ではない」の判定ロジックです：

GitHub Actions のスケジュールが 0 21 * * *（UTC 21:00 = JST 翌日 6:00） → これは正しい
get_tournaments() 内の now_jst と on_ready() 内の today_text の計算が別々で不整合 → 軽微だが統一すべき
最大の問題：日付の比較に使う today が get_tournaments() の開始時刻 → 処理に時間がかかると日付がズレる可能性
要望の「実行日の大会が取得できなかった時点で中断」 → 現在は最後まで全件スキャンしてしまう
ログを再確認すると ft50T（5/30）は取得成功しているので、現状のロジックは概ね動いています。しかし要望に「取得できていない」とあるので、today の比較基準日がズレているケース（UTC日付で比較してしまうなど）と、中断処理がない点を修正します。


