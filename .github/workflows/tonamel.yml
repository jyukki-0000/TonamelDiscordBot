今回の根本的な設計変更
旧設計（問題あり）
一覧ページ → ID取得 → 各大会ページに個別アクセス × N件
                            ↑ここでタイムアウト頻発
新設計（シンプル・高速・安定）
一覧ページ1回のみアクセス → BeautifulSoupで直接パース → 完了
HTMLを見ると、一覧ページにタイトル・ID・日付がすべて含まれていたため、各大会ページへのアクセスが不要でした。

変更点まとめ
項目	旧	新
アクセス回数	1（一覧）+ N（各大会）	1回のみ
タイムアウトリスク	高（各大会でタイムアウト）	なし
HTML解析	正規表現	BeautifulSoup（li.list-item → a[href]・span.title・日付span）
requirements	discord.py, playwright, pytz	+ beautifulsoup4
待機方式	domcontentloaded	networkidle（SPA完全描画を待つ）
