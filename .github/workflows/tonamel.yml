# debug_html.py
import asyncio
from playwright.async_api import async_playwright

URL = "https://tonamel.com/competitions?game=shadowverse_worlds_beyond&region=JP"

async def main():
    async with async_playwright() as p:
        browser = await p.chromium.launch(headless=True, args=["--no-sandbox"])
        page = await browser.new_page()
        
        await page.goto(URL, wait_until="domcontentloaded", timeout=60000)
        
        # 待機時間を変えながら試す
        for wait_sec in [3, 6, 10]:
            await page.wait_for_timeout(1000)
            html = await page.content()
            print(f"待機{wait_sec}秒後のHTML文字数: {len(html)}")
            # /competition/ が何件含まれるか
            import re
            ids = re.findall(r'/competition/([A-Za-z0-9]+)', html)
            print(f"検出ID数: {len(set(ids) - {'index'})}")
        
        # 最終HTML保存
        html = await page.content()
        with open("tonamel_debug.html", "w", encoding="utf-8") as f:
            f.write(html)
        print("tonamel_debug.html に保存しました")
        
        await browser.close()

asyncio.run(main())
