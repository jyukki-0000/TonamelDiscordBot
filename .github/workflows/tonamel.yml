今回の修正内容
根本原因
ft50T → タイムアウト → スキップ
lN3Do → 5/31（未来）→「実行日の大会が取得できないため中断」← ❌ ここが誤り
前回追加した「実行日の大会情報が取得できなかった時点で中断」ロジックが、タイムアウトによる取りこぼしを「当日大会なし」と誤認してしまっていました。

修正①：中断ロジックを削除して全件スキャンに変更
タイムアウトで当日大会を1件取りこぼすと、その後に未来大会が出た時点で誤って中断してしまいます。大会一覧はほぼ日付順ですが、取得失敗が挟まると順序の保証が崩れるため、全件スキャンが安全です。

修正②：リトライ処理の追加
python
async def fetch_page_with_retry(context, url, retries=3):
タイムアウトが発生した場合、3秒待って最大3回リトライします。リトライ全滅してもスキップして次の大会に進み、中断はしません。

修正③：wait_until="networkidle" → "domcontentloaded" に変更
networkidle はSPAサイトでネットワーク通信が止まるまで待ち続けるため、タイムアウトが発生しやすいです。domcontentloaded に変更して、その後 wait_for_timeout(3000) でJS描画を待つ方式にしました。


